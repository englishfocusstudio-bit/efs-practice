<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EFS Speaking · My Hobby</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="./">EFS <span>Speaking</span></a
      ><span class="tag">PILOT 001</span>
    </header>
    <div class="layout">
      <aside>
        <p class="eyebrow">YOUR PRACTICE SPACE</p>
        <h1>Small steps.<br />Real conversations.</h1>
        <label for="topic">Chủ đề</label
        ><select id="topic"></select>
        <nav id="nav" aria-label="Các bước luyện nói"></nav>
        <label class="import"
          >＋ Nhập topic JSON<input
            id="import"
            type="file"
            accept="application/json,.json"
        /></label>
        <p class="muted">
          Riêng tư trên thiết bị của bạn.<br />Không có AI hoặc tải bản ghi lên
          máy chủ.
        </p>
      </aside>
      <main>
        <div class="topline">
          <span id="breadcrumb"></span
          ><span class="tag" id="topic-tag">MY HOBBY</span>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
        <div id="view"></div>
        <footer>EFS Speaking · Practice at your own pace.</footer>
      </main>
    </div>
  </body>
</html>
