<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EFS Practice</title>
<style>
:root{--bg:#f3f7fb;--card:#fff;--text:#18324a;--muted:#6d8193;--accent:#20a6b7;--line:#dce7ee;--good:#2e9469;--bad:#d85b63;--soft:#e9f7f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}.app{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:25px;font-weight:850}.brand span{color:var(--accent)}.badge{font-size:12px;padding:7px 10px;border-radius:999px;background:var(--soft);font-weight:800}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 30px rgba(28,68,93,.06)}h1{font-size:28px;margin:0 0 8px}.muted{color:var(--muted)}.set{border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}button,select{font:inherit;border-radius:12px;border:0;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#edf3f6;color:var(--text)}.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.hidden{display:none!important}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 16px}.progress{height:7px;background:#e8eff3;border-radius:99px;overflow:hidden;margin:8px 0 18px}.progress div{height:100%;background:var(--accent)}.flash{min-height:330px;border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;place-items:center;text-align:center}.front{font-size:40px;font-weight:850}.pos{display:inline-block;background:var(--soft);padding:6px 10px;border-radius:999px;font-size:14px;font-weight:800;margin-bottom:12px}.meaning{font-size:26px;font-weight:800}.extra{font-size:17px;font-weight:650;margin-top:12px}.example{font-size:16px;color:var(--muted);margin-top:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.question{font-size:24px;font-weight:800;line-height:1.45;margin:12px 0 18px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{border:1px solid var(--line);background:#fff;text-align:left;min-height:62px;font-size:17px}.option.correct{border-color:var(--good);background:#edf9f4}.option.wrong{border-color:var(--bad);background:#fff0f1}.feedback{margin-top:16px;border-radius:16px;padding:16px;line-height:1.6}.feedback.good{background:#edf9f4}.feedback.bad{background:#fff0f1}.small{font-size:12px;color:var(--muted)}.error{padding:16px;border-radius:14px;background:#fff0f1;color:#98414a}.panel,.set,.flash,.option,.question,.front,.meaning,.extra,.example,h1,b{
  min-width:0;
  max-width:100%;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.set>div{min-width:0;flex:1}
.set button{flex:0 0 auto}
.options{min-width:0}
.option{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
@media(max-width:700px){
  .app{padding:10px}
  .panel{padding:14px;border-radius:16px}
  h1{font-size:22px;line-height:1.3}
  .set{align-items:flex-start;padding:12px;gap:8px}
  .set button{padding:9px 12px}
  .toolbar{gap:8px}
  .toolbar select,.toolbar button{max-width:100%}
  .options{grid-template-columns:1fr}
  .front{font-size:30px;line-height:1.25}
  .question{font-size:20px;line-height:1.4}
  .meaning{font-size:22px}
  .extra{font-size:16px}
  .example{font-size:15px}
  .flash{min-height:280px;padding:16px}
  .option{font-size:16px;line-height:1.4;min-height:56px;padding:12px}
  .actions{width:100%}
  .actions button{flex:1 1 30%;min-width:0}
}.front{font-size:34px}.question{font-size:21px}.meaning{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="brand">EFS <span>Practice</span></div><div class="badge">Classroom</div></div>
<div class="panel">
<div id="library"><p class="muted">Đang tải học phần...</p></div>
<div id="practice" class="hidden">
<div id="count" class="small"></div>
<div class="progress"><div id="bar"></div></div>
<h1 id="title"></h1>
<div class="toolbar"><b>Thứ tự:</b><select id="mode"><option value="random">Ngẫu nhiên — mặc định</option><option value="ordered">Theo worksheet</option></select><button id="shuffle" class="ghost">Xáo trộn lại</button><button id="home" class="secondary">Danh sách học phần</button></div>
<div id="flashArea" class="hidden"><div id="flash" class="flash"><div id="front" class="front"></div><div id="back" class="hidden"><div id="pos" class="pos"></div><div id="meaning" class="meaning"></div><div id="extra1" class="extra"></div><div id="extra2" class="extra"></div><div id="example" class="example"></div></div></div><div class="actions"><button id="prev" class="secondary">Trước</button><button id="flip" class="ghost">Lật thẻ</button><button id="next" class="primary">Tiếp</button></div></div>
<div id="mcqArea" class="hidden"><div id="question" class="question"></div><div id="options" class="options"></div><div id="feedback" class="hidden"></div><div class="actions"><button id="nextQ" class="primary hidden">Câu tiếp theo</button></div></div>
</div>
</div>
</div>
<script>
var registry=[],currentSet=null,order=[],index=0,mode="random",locked=false;
function el(id){return document.getElementById(id);}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function isMCQ(c){return !!(c&&c.A&&c.B&&c.C&&c.D&&c.key);}
async function loadRegistry(){var r=await fetch("sets/index.json",{cache:"no-store"});if(!r.ok)throw new Error("Không tải được danh mục học phần.");registry=await r.json();}
async function loadSet(id){var item=registry.find(function(x){return x.id===id;});if(!item)throw new Error("Không tìm thấy học phần.");var r=await fetch(item.file,{cache:"no-store"});if(!r.ok)throw new Error("Không tải được học phần.");return await r.json();}
function buildOrder(){order=[];for(var i=0;i<currentSet.cards.length;i++)order.push(i);if(mode==="random"){for(var j=order.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=order[j];order[j]=order[k];order[k]=t;}}index=0;}
function setText(id,v){el(id).textContent=v||"";el(id).classList.toggle("hidden",!v);}
function showError(msg){el("library").classList.remove("hidden");el("practice").classList.add("hidden");el("library").innerHTML="<div class='error'>"+esc(msg)+"</div>";}
function showLibrary(){history.replaceState(null,"",location.pathname);el("practice").classList.add("hidden");el("library").classList.remove("hidden");var h="<h1>Học phần</h1><p class='muted'>Chọn một bộ để luyện tập.</p>";registry.filter(function(x){return x.status==="published";}).forEach(function(s){h+="<div class='set'><div><b>"+esc(s.title)+"</b><div class='small'>"+esc(s.type)+" · "+s.count+" thẻ/câu</div></div><button class='primary' data-id='"+esc(s.id)+"'>Mở</button></div>";});el("library").innerHTML=h;el("library").querySelectorAll("button[data-id]").forEach(function(b){b.onclick=function(){openSet(this.getAttribute("data-id"));};});}
async function openSet(id){try{currentSet=await loadSet(id);history.replaceState(null,"","?set="+encodeURIComponent(id));el("library").classList.add("hidden");el("practice").classList.remove("hidden");buildOrder();render();}catch(e){showError(e.message);}}
function currentCard(){return currentSet.cards[order[index]];}
function render(){var c=currentCard();el("title").textContent=currentSet.title;el("count").textContent=(index+1)+" / "+currentSet.cards.length;el("bar").style.width=((index+1)/currentSet.cards.length*100)+"%";el("shuffle").classList.toggle("hidden",mode!=="random");if(isMCQ(c))renderMCQ(c);else renderFlash(c);}
function renderFlash(c){el("mcqArea").classList.add("hidden");el("flashArea").classList.remove("hidden");el("front").textContent=c.front;el("front").classList.remove("hidden");el("back").classList.add("hidden");setText("pos",c.backTitle);setText("meaning",c.backContent);setText("extra1",c.extra1);setText("extra2",c.extra2);setText("example",c.example);}
function flip(){el("front").classList.toggle("hidden");el("back").classList.toggle("hidden");}
function renderMCQ(c){locked=false;el("flashArea").classList.add("hidden");el("mcqArea").classList.remove("hidden");el("question").textContent=c.front;el("feedback").className="hidden";el("feedback").innerHTML="";el("nextQ").classList.add("hidden");var h="";["A","B","C","D"].forEach(function(k){h+="<button class='option' data-k='"+k+"'><b>"+k+".</b> "+esc(c[k])+"</button>";});el("options").innerHTML=h;el("options").querySelectorAll(".option").forEach(function(o){o.onclick=function(){answer(this.getAttribute("data-k"),this);};});}
function answer(k,btn){if(locked)return;locked=true;var c=currentCard();el("options").querySelectorAll(".option").forEach(function(o){if(o.getAttribute("data-k")===c.key)o.classList.add("correct");});var ok=k===c.key;if(!ok)btn.classList.add("wrong");var f=el("feedback");f.className="feedback "+(ok?"good":"bad");var t=(ok?"✓ Chính xác":"✗ Chưa đúng")+"<br><b>Đáp án:</b> "+c.key+". "+esc(c[c.key]);if(c.explanation)t+="<br><br><b>Giải thích:</b> "+esc(c.explanation);if(c.grammarSignal)t+="<br><b>Dấu hiệu:</b> "+esc(c.grammarSignal);if(c.grammarStructure)t+="<br><b>Cấu trúc:</b> "+esc(c.grammarStructure);f.innerHTML=t;el("nextQ").classList.remove("hidden");}
function step(n){index=(index+n+order.length)%order.length;render();}
el("flip").onclick=flip;el("flash").onclick=flip;el("next").onclick=function(){step(1);};el("prev").onclick=function(){step(-1);};el("nextQ").onclick=function(){step(1);};el("home").onclick=showLibrary;el("mode").onchange=function(){mode=this.value;buildOrder();render();};el("shuffle").onclick=function(){mode="random";el("mode").value="random";buildOrder();render();};
(async function(){try{await loadRegistry();var id=new URLSearchParams(location.search).get("set");if(id)await openSet(id);else showLibrary();}catch(e){showError(e.message);}})();
</script>
</body>
</html>
