<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EFS Global Vocabulary Practice</title>
<style>
:root{
  --bg:#f3f7fb;
  --card:#ffffff;
  --text:#18324A;
  --muted:#6D8193;
  --accent:#20A6B7;
  --line:#DCE7EE;
  --soft:#E9F7F9;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,"Segoe UI",Arial,sans-serif;
}
.app{max-width:860px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.brand{font-size:24px;font-weight:900;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.badge{font-size:12px;padding:7px 10px;border-radius:999px;background:var(--soft);font-weight:900;white-space:nowrap}
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  box-shadow:0 8px 30px rgba(28,68,93,.06);
}
h1{font-size:26px;line-height:1.25;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.quickControls{display:flex;gap:10px;align-items:end;justify-content:space-between;margin:12px 0 14px}
.languageControl{display:flex;flex-direction:column;gap:6px;min-width:180px}
.languageControl label,.settingsPanel label{font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.settingsBtn{white-space:nowrap}
.settingsPanel{margin:0 0 14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#f9fbfc}
.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settingsGrid>div{display:flex;flex-direction:column;gap:6px}
.shuffleBtn{margin-top:12px}
button,select{
  font:inherit;
  border-radius:12px;
  border:0;
  padding:11px 15px;
  font-weight:850;
  cursor:pointer;
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#edf3f6;color:var(--text)}
.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.hidden{display:none!important}
.progress{height:7px;background:#e8eff3;border-radius:99px;overflow:hidden;margin:8px 0 18px}
.progress div{height:100%;background:var(--accent)}
.flash{
  min-height:360px;
  border:1px solid var(--line);
  border-radius:20px;
  padding:0;
  background:#fff;
  overflow:hidden;
  perspective:1200px;
}
.flipStage{min-height:360px;width:100%}
.flipInner{
  position:relative;
  width:100%;
  min-height:360px;
  transform-style:preserve-3d;
  transition:transform .42s cubic-bezier(.2,.7,.2,1);
}
.flipInner.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;
  inset:0;
  min-height:360px;
  padding:24px;
  display:grid;
  place-items:center;
  text-align:center;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.frontFace{background:#fff}
.backFace{
  background:#fff;
  transform:rotateY(180deg);
  align-items:start;
  overflow:auto;
}
#back{width:100%;max-width:760px;margin:auto}
.flipHint{
  margin-top:18px;
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  letter-spacing:.02em;
  display:flex;
  gap:6px;
  align-items:center;
  justify-content:center;
  opacity:.85;
}
.flipIcon{
  display:inline-block;
  font-size:16px;
  color:var(--accent);
  animation:flipCue 2.2s ease-in-out infinite;
}
@keyframes flipCue{
  0%,70%,100%{transform:rotate(0deg)}
  82%{transform:rotate(24deg)}
  92%{transform:rotate(-14deg)}
}
.backHint{margin-bottom:4px}
.front{font-size:40px;font-weight:900;line-height:1.2}
.pos{
  display:inline-block;
  background:var(--soft);
  color:var(--text);
  padding:6px 10px;
  border-radius:999px;
  font-size:13px;
  font-weight:900;
  margin-bottom:12px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.meaning{font-size:25px;font-weight:850;line-height:1.35}
.extra{font-size:17px;font-weight:650;margin-top:12px;line-height:1.45}
.sectionLabel{margin-top:12px;margin-bottom:8px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.meaningGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.infoBox,.exampleBox{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;text-align:left}
.infoBox:first-child{background:var(--soft);border-color:#cfecef}
.boxLabel{font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.boxText{font-size:17px;font-weight:700;line-height:1.5;color:var(--text)}
.exampleSection{margin-top:18px}
.example{font-size:16px;color:var(--text);line-height:1.6;text-align:left}
.example b{color:var(--text);font-weight:900}
.exampleTranslation{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:15px;color:var(--muted);line-height:1.55;text-align:left}
.speakBtn{margin-top:14px;padding:9px 12px;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1.15fr 1.35fr;gap:10px;margin-top:16px}
.actions button{min-height:46px}
.error{
  padding:18px;
  border:1px solid #f0c9cd;
  border-radius:16px;
  background:#fff;
  line-height:1.55;
}
.empty{
  min-height:280px;
  display:grid;
  place-items:center;
  text-align:center;
  padding:30px 18px;
  border:1px dashed var(--line);
  border-radius:18px;
}
.panel,.flash,.front,.meaning,.extra,.example,h1{
  min-width:0;
  max-width:100%;
  overflow-wrap:anywhere;
  word-break:break-word;
}
@media(max-width:700px){
  .app{padding:10px}
  .panel{padding:14px;border-radius:16px}
  .top{align-items:flex-start}
  .brand{font-size:21px}
  h1{font-size:21px}
  .front{font-size:31px}
  .meaning{font-size:22px}
  .extra{font-size:16px}
  .example{font-size:15px}
  .meaningGrid{grid-template-columns:1fr}
  .quickControls{align-items:end;gap:8px}
  .languageControl{min-width:0;flex:1}
  .settingsBtn{padding:11px 12px}
  .settingsPanel{padding:12px}
  .settingsGrid{grid-template-columns:1fr}
  .flash{min-height:300px}
  .flipStage,.flipInner,.face{min-height:300px}
  .face{padding:16px}
  .actions{grid-template-columns:.9fr 1fr 1.25fr;gap:8px;position:sticky;bottom:8px;z-index:5;background:rgba(243,247,251,.92);padding:8px;border-radius:14px;backdrop-filter:blur(8px)}
  .actions button{padding:12px 8px;min-height:48px}
  #voice{max-width:100%}
}
@media(max-width:420px){
  .app{padding:8px}
  .panel{padding:12px}
  .top{margin-bottom:12px}
  .brand{font-size:19px}
  .badge{font-size:10px;padding:6px 8px}
  h1{font-size:19px}
  .front{font-size:28px}
  .boxText{font-size:16px}
  .quickControls{margin-top:10px}
  .actions button{font-size:13px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">EFS <span>Vocabulary</span></div>
    <div class="badge">Global Practice</div>
  </div>

  <div class="panel">
    <div id="emptyState" class="empty hidden">
      <div>
        <h1>Open a practice link</h1>
        <p class="muted">This app opens one vocabulary, phrase, collocation, or chunk set at a time.</p>
      </div>
    </div>

    <div id="practice" class="hidden">
      <div id="count" class="small"></div>
      <div class="progress"><div id="bar"></div></div>
      <h1 id="title"></h1>

      <div class="quickControls">
        <div class="languageControl">
          <label for="lang">Language</label>
          <select id="lang"></select>
        </div>
        <button id="settingsBtn" class="ghost settingsBtn" type="button">⚙ Settings</button>
      </div>

      <div id="settingsPanel" class="settingsPanel hidden">
        <div class="settingsGrid">
          <div>
            <label for="mode">Order</label>
            <select id="mode">
              <option value="random">Random</option>
              <option value="ordered">Original order</option>
            </select>
          </div>
          <div>
            <label for="voice">Voice</label>
            <select id="voice"></select>
          </div>
        </div>
        <button id="shuffle" class="ghost shuffleBtn" type="button">Shuffle again</button>
      </div>

      <div id="flash" class="flash">
        <div id="flipStage" class="flipStage">
          <div id="flipInner" class="flipInner">
            <div class="face frontFace">
              <div id="frontWrap">
                <div id="front" class="front"></div>
                <button id="speakFront" class="ghost speakBtn" type="button">🔊 Listen</button>
                <div class="flipHint"><span class="flipIcon">↻</span> Tap to flip</div>
              </div>
            </div>

            <div class="face backFace">
              <div id="back">
                <div id="pos" class="pos"></div>

                <div class="sectionLabel">Meaning</div>
                <div class="meaningGrid">
                  <div class="infoBox">
                    <div class="boxLabel">English</div>
                    <div id="meaning" class="boxText"></div>
                  </div>
                  <div id="localizedBox" class="infoBox hidden">
                    <div id="localizedLabel" class="boxLabel"></div>
                    <div id="localized" class="boxText"></div>
                  </div>
                </div>

                <div class="sectionLabel exampleSection">Example</div>
                <div class="exampleBox">
                  <div id="example" class="example"></div>
                  <div id="exampleTranslation" class="exampleTranslation hidden"></div>
                </div>

                <button id="speakExample" class="ghost speakBtn hidden" type="button">🔊 Listen to example</button>
                <div class="flipHint backHint"><span class="flipIcon">↻</span> Tap to flip back</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="prev" class="secondary">Previous</button>
        <button id="flip" class="ghost">Flip card</button>
        <button id="next" class="primary">Next</button>
      </div>
    </div>

    <div id="error" class="error hidden"></div>
  </div>
</div>

<script>
var currentSet=null,order=[],index=0,mode="random";

function el(id){return document.getElementById(id);}
function setText(id,v){el(id).textContent=v||"";el(id).classList.toggle("hidden",!v);}
function safeId(v){return /^[a-zA-Z0-9_-]+$/.test(v||"")?v:"";}

async function loadSet(id){
  var clean=safeId(id);
  if(!clean)throw new Error("Invalid practice link.");
  var r=await fetch("sets/"+clean+".json",{cache:"no-store"});
  if(!r.ok)throw new Error("This practice set could not be loaded.");
  var data=await r.json();
  if(!data.cards||!Array.isArray(data.cards))throw new Error("This practice set is not available.");
  return data;
}

function buildOrder(){
  order=[];
  for(var i=0;i<currentSet.cards.length;i++)order.push(i);
  if(mode==="random"){
    for(var j=order.length-1;j>0;j--){
      var k=Math.floor(Math.random()*(j+1)),t=order[j];
      order[j]=order[k];order[k]=t;
    }
  }
  index=0;
}

function currentCard(){return currentSet.cards[order[index]];}

var LANGS={
  en:"English",vi:"Tiếng Việt",es:"Español",pt:"Português",fr:"Français",
  de:"Deutsch",it:"Italiano",nl:"Nederlands",pl:"Polski",ro:"Română",
  cs:"Čeština",hu:"Magyar",sv:"Svenska",no:"Norsk",da:"Dansk",fi:"Suomi",
  el:"Ελληνικά",uk:"Українська",ru:"Русский",tr:"Türkçe",
  id:"Bahasa Indonesia",ms:"Bahasa Melayu",th:"ไทย",km:"ខ្មែរ",lo:"ລາວ",my:"မြန်မာ",tl:"Filipino",
  ja:"日本語",ko:"한국어",zh:"中文",zh_TW:"繁體中文",
  ar:"العربية",fa:"فارسی",he:"עברית",hi:"हिन्दी",bn:"বাংলা",
  ur:"اردو",ta:"தமிழ்",te:"తెలుగు",mr:"मराठी",gu:"ગુજરાતી",
  sw:"Kiswahili",am:"አማርኛ",ha:"Hausa",yo:"Yorùbá",zu:"isiZulu",so:"Soomaali",af:"Afrikaans",
  bg:"Български",sr:"Српски",hr:"Hrvatski",sk:"Slovenčina",
  sl:"Slovenščina",lt:"Lietuvių",lv:"Latviešu",et:"Eesti"
};
var selectedLang=localStorage.getItem("efsGlobalLang")||"en";

function availableLangs(){
  var langs={en:true};
  (currentSet.cards||[]).forEach(function(c){
    if(c.translations)Object.keys(c.translations).forEach(function(k){langs[k]=true;});
  });
  return Object.keys(langs);
}
function renderLangOptions(){
  var langs=availableLangs();
  if(langs.indexOf(selectedLang)<0)selectedLang="en";
  el("lang").innerHTML=langs.map(function(k){
    return "<option value='"+k+"'>"+(LANGS[k]||k.toUpperCase())+"</option>";
  }).join("");
  el("lang").value=selectedLang;
  el("lang").title="Languages available for this practice set";
}
function escapeHtml(v){
  return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function highlightExample(example,front){
  var e=String(example||""), f=String(front||"").trim();
  if(!e||!f)return escapeHtml(e);
  var i=e.toLowerCase().indexOf(f.toLowerCase());
  if(i<0)return escapeHtml(e);
  return escapeHtml(e.slice(0,i))+"<b>"+escapeHtml(e.slice(i,i+f.length))+"</b>"+escapeHtml(e.slice(i+f.length));
}
function localizedExample(c){
  if(selectedLang==="en")return "";
  return c.exampleTranslations && c.exampleTranslations[selectedLang] ? c.exampleTranslations[selectedLang] : "";
}

function audioEligible(c){
  return c.audio!==false;
}

var voiceList=[];
var selectedVoiceName=localStorage.getItem("efsGlobalVoice")||"";

function naturalScore(v){
  var n=(v.name||"").toLowerCase();
  var s=0;
  if(/natural|neural|online/.test(n))s+=100;
  if(/google/.test(n))s+=80;
  if(/microsoft/.test(n))s+=75;
  if(/samantha|ava|allison|serena|daniel|karen|moira|tessa/.test(n))s+=60;
  if(/^en[-_]/i.test(v.lang||""))s+=40;
  if(/en-us/i.test(v.lang||""))s+=10;
  if(/compact|espeak|robot/.test(n))s-=100;
  return s;
}

function loadVoices(){
  if(!("speechSynthesis" in window))return;
  voiceList=window.speechSynthesis.getVoices().filter(function(v){
    return /^en[-_]/i.test(v.lang||"");
  }).sort(function(a,b){return naturalScore(b)-naturalScore(a);});

  var voiceSel=el("voice");
  if(!voiceSel)return;
  voiceSel.innerHTML="";

  var auto=document.createElement("option");
  auto.value="";
  auto.textContent="Auto — Natural English";
  voiceSel.appendChild(auto);

  voiceList.slice(0,20).forEach(function(v){
    var o=document.createElement("option");
    o.value=v.name;
    o.textContent=v.name+" ("+(v.lang||"English")+")";
    voiceSel.appendChild(o);
  });

  if(selectedVoiceName && voiceList.some(function(v){return v.name===selectedVoiceName;})){
    voiceSel.value=selectedVoiceName;
  }else{
    selectedVoiceName="";
    voiceSel.value="";
  }
}

function chosenVoice(){
  if(selectedVoiceName){
    return voiceList.find(function(v){return v.name===selectedVoiceName;})||null;
  }
  return voiceList.length?voiceList[0]:null;
}

function speakText(text){
  if(!text||!("speechSynthesis" in window))return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  var v=chosenVoice();
  if(v){
    u.voice=v;
    u.lang=v.lang||"en-US";
  }else{
    u.lang="en-US";
  }
  var level=((currentSet&&currentSet.level)||"").toLowerCase();
  if(level.indexOf("early a1")>=0) u.rate=0.78;
  else if(level==="a1" || level.indexOf(" a1")>=0) u.rate=0.84;
  else u.rate=0.90;
  u.pitch=1.0;
  u.volume=1.0;
  window.speechSynthesis.speak(u);
}

function render(){
  var c=currentCard();
  el("title").textContent=currentSet.title||"Vocabulary Practice";
  el("count").textContent=(index+1)+" / "+currentSet.cards.length;
  el("bar").style.width=((index+1)/currentSet.cards.length*100)+"%";
  el("shuffle").classList.toggle("hidden",mode!=="random");

  el("front").textContent=c.front||"";
  el("flipInner").classList.remove("flipped");

  setText("pos",c.backTitle);
  setText("meaning",c.definition||c.backContent);

  var loc="";
  if(selectedLang!=="en" && c.translations && c.translations[selectedLang]){
    loc=c.translations[selectedLang];
  }
  el("localizedLabel").textContent=LANGS[selectedLang]||selectedLang.toUpperCase();
  el("localized").textContent=loc;
  el("localizedBox").classList.toggle("hidden",!loc);

  el("example").innerHTML=c.example?highlightExample(c.example,c.front):"";
  el("example").classList.toggle("hidden",!c.example);

  var exLoc=localizedExample(c);
  el("exampleTranslation").textContent=exLoc;
  el("exampleTranslation").classList.toggle("hidden",!exLoc);

  var eligible=audioEligible(c);
  el("speakFront").classList.toggle("hidden",!eligible);
  el("speakExample").classList.toggle("hidden",!(eligible&&c.example));
}

function flip(){
  el("flipInner").classList.toggle("flipped");
}

function step(n){
  index=(index+n+order.length)%order.length;
  render();
}

async function init(){
  var id=new URLSearchParams(location.search).get("set");
  if(!id){
    el("emptyState").classList.remove("hidden");
    return;
  }
  try{
    currentSet=await loadSet(id);
    renderLangOptions();
    buildOrder();
    el("practice").classList.remove("hidden");
    render();
  }catch(e){
    el("error").textContent=e.message;
    el("error").classList.remove("hidden");
  }
}

el("flip").onclick=flip;
el("flash").onclick=flip;
el("speakFront").onclick=function(e){e.stopPropagation();var c=currentCard();speakText(c.speakText||c.front);};
el("speakExample").onclick=function(e){e.stopPropagation();var c=currentCard();speakText(c.example);};
el("next").onclick=function(){step(1);};
el("prev").onclick=function(){step(-1);};
el("mode").onchange=function(){mode=this.value;buildOrder();render();};
el("shuffle").onclick=function(){mode="random";el("mode").value="random";buildOrder();render();};
el("lang").onchange=function(){selectedLang=this.value;localStorage.setItem("efsGlobalLang",selectedLang);render();};
el("voice").onchange=function(){
  selectedVoiceName=this.value;
  localStorage.setItem("efsGlobalVoice",selectedVoiceName);
};
el("settingsBtn").onclick=function(){
  el("settingsPanel").classList.toggle("hidden");
};
if("speechSynthesis" in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged=loadVoices;
}

init();
</script>
</body>
</html>
